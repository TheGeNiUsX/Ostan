<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradient 1: Vibrant Cyan to Electric Blue -->
    <linearGradient id="ostan-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Gradient 2: Electric Indigo to Violet -->
    <linearGradient id="ostan-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="ostan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Ribbon Loop -->
  <path d="M 50 10 
           A 40 40 0 1 1 18 78 
           A 32 32 0 1 0 50 20 
           A 30 30 0 0 1 76 34
           A 40 40 0 0 0 50 10 Z" 
        fill="url(#ostan-grad-1)" 
        filter="url(#ostan-glow)" />

  <!-- Inner Interlocking Ribbon Loop -->
  <path d="M 50 20 
           A 30 30 0 1 1 24 68 
           A 22 22 0 1 0 50 28 
           A 20 20 0 0 1 68 40
           A 30 30 0 0 0 50 20 Z" 
        fill="url(#ostan-grad-2)" 
        opacity="0.9" />

  <!-- Ambient Light Center Core -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="url(#ostan-grad-1)" stroke-width="2.5" opacity="0.6" />
</svg>
