services:
  - type: web
    name: ostan-whatsapp-gateway
    env: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server/whatsapp-gateway.mjs
    healthCheckPath: /health
    disk:
      name: whatsapp-sessions
      mountPath: /app/whatsapp_sessions
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
